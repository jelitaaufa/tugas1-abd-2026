
services:
  notebook:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: corpus-indonesia-notebook-submit

    ports:
      - "127.0.0.1:8889:8888"

    environment:
      POLARS_MAX_THREADS: "4"

    volumes:
      - .:/workspace

    working_dir: /workspace

    command:
      - jupyter
      - notebook
      - --ip=0.0.0.0
      - --port=8888
      - --no-browser
      - --allow-root
      - --ServerApp.root_dir=/workspace

    restart: unless-stopped
