services:
  notebook:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: corpus-indonesia-notebook
    ports:
      - "127.0.0.1:8888:8888"
    volumes:
      - .:/workspace
    working_dir: /workspace
    command:
      - jupyter
      - notebook
      - --ip=0.0.0.0
      - --port=8888
      - --no-browser
      - --allow-root
      - --ServerApp.root_dir=/workspace
    restart: unless-stopped
